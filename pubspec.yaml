name: premium_auth_app
description: Premium Authentication & Profile module (Flutter, Firebase, Riverpod, GoRouter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  http: ^1.2.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Social sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  flutter_facebook_auth: ^7.1.1
  crypto: ^3.0.3 # SHA-256 nonce hashing for Sign in with Apple

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  responsive_framework: ^1.4.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.3
  flutter_svg: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  firebase_core_platform_interface: ^5.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/profile.jpg
    - assets/onboarding/
